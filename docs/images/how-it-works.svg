<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .accent { fill: #ddf4ff; stroke: #54aeff; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .text { fill: #59636e; font-size: 12.5px; }
    .code { fill: #0969da; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .label { fill: #59636e; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .arrow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .head { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .accent { fill: #0c2d4b; stroke: #1f6feb; }
      .title { fill: #e6edf3; }
      .text { fill: #9198a1; }
      .code { fill: #4493f8; }
      .label { fill: #9198a1; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="330" rx="12"/>

  <!-- the program -->
  <rect class="box" x="24" y="110" width="170" height="110" rx="10" stroke-width="1.2"/>
  <text class="code" x="109" y="140" text-anchor="middle">main.go</text>
  <text class="title" x="109" y="164" text-anchor="middle">Your program</text>
  <text class="text" x="109" y="186" text-anchor="middle">plain Go, no Java,</text>
  <text class="text" x="109" y="203" text-anchor="middle">Gradle or Studio</text>

  <!-- the pieces -->
  <path class="arrow" d="M194,165 H246" marker-end="url(#arrow)"/>
  <rect class="accent" x="250" y="85" width="240" height="160" rx="10" stroke-width="1.4"/>
  <text class="code" x="370" y="113" text-anchor="middle">material/</text>
  <text class="title" x="370" y="137" text-anchor="middle">Material 3 pieces</text>
  <text class="text" x="370" y="161" text-anchor="middle">bars, buttons, fields, sheets,</text>
  <text class="text" x="370" y="178" text-anchor="middle">carousels, the wallpaper's colours</text>
  <text class="text" x="370" y="202" text-anchor="middle">drawn with go-ui,</text>
  <text class="text" x="370" y="219" text-anchor="middle">on go-renderer</text>

  <!-- where it runs -->
  <path class="arrow" d="M490,125 C530,125 530,62 572,62" marker-end="url(#arrow)"/>
  <path class="arrow" d="M490,165 H572" marker-end="url(#arrow)"/>
  <path class="arrow" d="M490,205 C530,205 530,268 572,268" marker-end="url(#arrow)"/>
  <text class="label" x="531" y="48" text-anchor="middle">go-ui-apk</text>
  <text class="label" x="531" y="157" text-anchor="middle">go run</text>
  <text class="label" x="531" y="300" text-anchor="middle">GOOS=js</text>

  <rect class="box" x="576" y="20" width="280" height="84" rx="10" stroke-width="1.2"/>
  <text class="title" x="596" y="50">An Android app</text>
  <text class="text" x="596" y="72">an .apk, or an App Bundle for Play,</text>
  <text class="text" x="596" y="89">loaded by Android's NativeActivity</text>

  <rect class="box" x="576" y="128" width="280" height="74" rx="10" stroke-width="1.2"/>
  <text class="title" x="596" y="158">A desktop window</text>
  <text class="text" x="596" y="180">the same program, on a computer</text>

  <rect class="box" x="576" y="226" width="280" height="84" rx="10" stroke-width="1.2"/>
  <text class="title" x="596" y="256">A web page</text>
  <text class="text" x="596" y="278">built for WebAssembly,</text>
  <text class="text" x="596" y="295">drawn in a canvas</text>
</svg>
